name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'

jobs:
  publish:
    name: Publish usage-fyi to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm (OIDC trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches packages/cli/package.json
        run: |
          PKG_VERSION="cli-v$(node -p "require('./packages/cli/package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match packages/cli/package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Type check
        run: npm run typecheck --workspace=usage-fyi

      - name: Lint
        run: npm run lint --workspace=usage-fyi

      - name: Test
        run: npm run test --workspace=usage-fyi

      - name: Build
        run: npm run build --workspace=usage-fyi

      - name: Publish
        run: npm publish --access public --workspace=usage-fyi
