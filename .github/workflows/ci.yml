name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test bin shim via symlink
        run: |
          ln -s "$PWD/dist/index.js" /tmp/usage-fyi-symlink-test
          out=$(/tmp/usage-fyi-symlink-test --version)
          expected="$(node -p "require('./package.json').version")"
          if [ "$out" != "$expected" ]; then
            echo "Expected '$expected', got '$out' — bin entrypoint did not invoke run()."
            exit 1
          fi
          echo "bin shim OK: $out"
